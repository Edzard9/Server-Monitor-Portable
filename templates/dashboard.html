<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NetSentinel Pro</title>
    <style>
      :root {
        --bg: #0f111a;
        --card: #1a1d29;
        --text: #fff;
        --blue: #3b82f6;
        --green: #10b981;
        --red: #ef4444;
        --yellow: #f59e0b;
        --border: #2d3748;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 20px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .badge {
        background: var(--green);
        padding: 5px 15px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 0.8rem;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        position: relative;
      }
      .card h3 {
        margin: 0 0 10px;
        font-size: 0.8rem;
        color: #a0aec0;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .card .val {
        font-size: 2.5rem;
        font-weight: bold;
        margin: 5px 0;
      }
      .card .sub {
        font-size: 0.85rem;
        color: #718096;
      }

      .ai-card {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 20px;
        border-left: 5px solid var(--green);
        background: linear-gradient(90deg, #1a1d29 0%, #161922 100%);
      }
      .ai-icon {
        font-size: 2.5rem;
      }

      .lower-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }
      td,
      th {
        text-align: left;
        padding: 10px 0;
        border-bottom: 1px solid #2d3748;
        font-size: 0.9rem;
      }
      th {
        color: var(--blue);
      }
      .tr {
        text-align: right;
      }

      .cores {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
        gap: 8px;
        margin-top: 15px;
      }
      .core {
        background: #2d3748;
        height: 60px;
        border-radius: 4px;
        display: flex;
        align-items: flex-end;
        position: relative;
        overflow: hidden;
      }
      .bar {
        background: var(--blue);
        width: 100%;
        transition: height 0.3s;
        opacity: 0.9;
      }
      .core-label {
        position: absolute;
        bottom: 2px;
        width: 100%;
        text-align: center;
        font-size: 0.65rem;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 1px 1px 2px #000;
        pointer-events: none;
        z-index: 2;
      }

      @media (max-width: 900px) {
        .lower-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>NETSENTINEL <span style="color: var(--blue)">DASHBOARD</span></h1>
      <div class="badge">ONLINE</div>
    </div>
    <div class="grid-container" id="main-grid">
      <div class="card ai-card" id="ai-card">
        <div class="ai-icon">🤖</div>
        <div>
          <h3 style="color: var(--blue); margin-bottom: 5px">
            AI SYSTEM ADVISOR
          </h3>
          <div class="val" id="ai-status" style="font-size: 1.5rem; margin: 0">
            INITIALIZING...
          </div>
          <div class="sub" id="ai-msg">Collecting hardware telemetry...</div>
        </div>
      </div>
    </div>
    <div class="lower-grid">
      <div class="card">
        <h3>CPU Cores Load</h3>
        <div class="cores" id="cores-grid"></div>
      </div>
      <div class="card">
        <h3>Top Resource Users</h3>
        <h4 style="margin: 15px 0 5px 0; font-size: 0.8rem; color: #718096">
          CPU USAGE
        </h4>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>PID</th>
              <th class="tr">CPU%</th>
            </tr>
          </thead>
          <tbody id="tbl-cpu"></tbody>
        </table>
        <h4 style="margin: 20px 0 5px 0; font-size: 0.8rem; color: #718096">
          RAM USAGE
        </h4>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>PID</th>
              <th class="tr">RAM%</th>
            </tr>
          </thead>
          <tbody id="tbl-mem"></tbody>
        </table>
      </div>
    </div>
    <script>
      function update() {
        fetch("/api/stats")
          .then((r) => r.json())
          .then((d) => {
            const aiCard = document.getElementById("ai-card");
            const aiStatus = document.getElementById("ai-status");
            document.getElementById("ai-msg").innerHTML = `
                    <div>${d.ai.message}</div>
                    <div style="margin-top:4px; color:white; font-weight:bold;">
                        Next Restart: <span style="color:var(--blue)">${d.ai.prediction}</span>
                    </div>
                `;
            aiStatus.innerText = d.ai.status;
            let color = "#10b981";
            if (d.ai.severity === "medium") color = "#f59e0b";
            if (d.ai.severity === "high") color = "#ef4444";
            aiCard.style.borderLeftColor = color;
            aiStatus.style.color = color;
            let cardsHtml = ``;
            cardsHtml += `
                <div class="card">
                    <h3>CPU Total</h3>
                    <div class="val">${d.cpu.usage}%</div>
                    <div class="sub">Freq: ${d.cpu.freq} GHz</div>
                </div>`;
            cardsHtml += `
                <div class="card">
                    <h3>RAM Usage</h3>
                    <div class="val">${d.ram.usage}%</div>
                    <div class="sub">Total: ${d.ram.total} GB</div>
                </div>`;
            d.disks.forEach((disk) => {
              cardsHtml += `
                    <div class="card">
                        <h3>Disk (${disk.mount})</h3>
                        <div class="val">${disk.percent}%</div>
                        <div class="sub">Total: ${disk.total} GB</div>
                    </div>`;
            });
            if (d.gpus.length > 0) {
              d.gpus.forEach((gpu) => {
                cardsHtml += `
                        <div class="card">
                            <h3>${gpu.name}</h3>
                            <div class="val">${gpu.load}%</div>
                            <div class="sub">VRAM: ${gpu.memory_info}</div>
                        </div>`;
              });
            } else {
              cardsHtml += `<div class="card"><h3>GPU</h3><div class="val">N/A</div><div class="sub">No GPU Detected</div></div>`;
            }
            const mainGrid = document.getElementById("main-grid");
            mainGrid.innerHTML = aiCard.outerHTML + cardsHtml;
            const coresGrid = document.getElementById("cores-grid");
            coresGrid.innerHTML = d.cpu.cores
              .map(
                (load, i) => `
                    <div class="core" title="Core ${i}: ${load}%">
                        <div class="bar" style="height:${load}%"></div>
                        <div class="core-label">C${i}</div>
                    </div>
                `
              )
              .join("");
            document.getElementById("tbl-cpu").innerHTML = d.top_cpu
              .map(
                (p) =>
                  `<tr><td>${p.name}</td><td>${p.pid}</td><td class="tr">${p.cpu_percent}%</td></tr>`
              )
              .join("");

            document.getElementById("tbl-mem").innerHTML = d.top_mem
              .map(
                (p) =>
                  `<tr><td>${p.name}</td><td>${p.pid}</td><td class="tr">${p.memory_percent}%</td></tr>`
              )
              .join("");
          });
      }
      setInterval(update, 2000);
      update();
    </script>
  </body>
</html>
